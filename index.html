<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customer Service Case Management Simulator</title>
<style>
:root{--bg:#f3f5f7;--sf:#fff;--ink:#16202b;--mut:#5d6b7a;--line:#d9e0e6;--ac:#0b6e6e;--acx:#fff;--warn:#b4580a;--bad:#b3261e;--ok:#2d7a3e;--soft:#e6f1f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--sf:#18222b;--ink:#e6edf3;--mut:#93a3b3;--line:#2b3947;--ac:#4cc2c2;--acx:#07201f;--warn:#f0a35e;--bad:#ff8a80;--ok:#7fd391;--soft:#173034;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171d;--sf:#18222b;--ink:#e6edf3;--mut:#93a3b3;--line:#2b3947;--ac:#4cc2c2;--acx:#07201f;--warn:#f0a35e;--bad:#ff8a80;--ok:#7fd391;--soft:#173034;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
h1{font:600 22px/1.2 Georgia,"Times New Roman",serif;margin:0 0 2px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px}
.sub{color:var(--mut);margin:0 0 16px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:6px;padding:10px 12px}.kpi b{display:block;font-size:24px;font-weight:600}.kpi span{color:var(--mut);font-size:12px}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--mut);font:inherit;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--ac);font-weight:600}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--sf);border:1px solid var(--line);border-radius:6px;padding:14px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 8px}
textarea{min-height:60px;resize:vertical}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:4px;padding:8px 14px;cursor:pointer;font-weight:600;margin-top:10px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.bad{background:var(--bad);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.filters{display:flex;gap:8px;margin-bottom:10px}.filters select{width:auto}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:9px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover,.row.sel{background:var(--soft)}.row small{color:var(--mut);display:block}
.id{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px}
.pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.pill.Critical,.pill.Escalated,.pill.breach{color:var(--bad);border-color:var(--bad)}.pill.High{color:var(--warn);border-color:var(--warn)}
.pill.Resolved,.pill.Closed{color:var(--ok);border-color:var(--ok)}
.steps{display:flex;gap:3px;margin:8px 0 12px}.steps i{flex:1;height:5px;background:var(--line);border-radius:3px}.steps i.on{background:var(--ac)}
.steplabels{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-top:-8px;margin-bottom:10px}
.note{border-left:3px solid var(--line);padding:2px 8px;margin:6px 0;font-size:13px}.note small{color:var(--mut);display:block}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
.scroll{overflow-x:auto}.empty{color:var(--mut);padding:18px 4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kb{border-bottom:1px solid var(--line);padding:10px 0}.kb b{display:block}.row2{display:flex;gap:8px;flex-wrap:wrap}
.hero{background:var(--ac);color:var(--acx);padding:20px 16px 58px}.hero .in{max-width:1100px;margin:0 auto}.hero h1{color:var(--acx)}.hero .sub{color:var(--acx);opacity:.85;margin:0}
.wrap{margin-top:-42px;padding-top:0}
.row{border-left:4px solid transparent}.row.p-Critical{border-left-color:var(--bad)}.row.p-High{border-left-color:var(--warn)}.row.p-Medium{border-left-color:var(--ac)}
.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:130px 1fr 28px;gap:8px;align-items:center;font-size:13px}.bar .t{background:var(--line);border-radius:5px;height:10px}.bar i{display:block;height:10px;border-radius:5px;background:var(--ac);min-width:2px}.bar.bad i{background:var(--bad)}.bar.warn i{background:var(--warn)}.bar.ok i{background:var(--ok)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
.board{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));gap:10px;overflow-x:auto}.col{background:var(--soft);border-radius:6px;padding:8px;min-height:120px}.col h3{margin:0 0 8px;font-size:13px}
.bc{background:var(--sf);border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:4px;padding:8px;margin-bottom:8px;font-size:13px;cursor:pointer}.bc.Critical{border-left-color:var(--bad)}.bc.High{border-left-color:var(--warn)}.bc small{color:var(--mut);display:block}
.sug{background:var(--soft);border-radius:4px;padding:8px;margin-top:10px;font-size:13px}.sug p{margin:6px 0 0}
:root{--bg:#f3f5fa;--sf:#fff;--ink:#0f1b33;--mut:#5a6783;--line:#dce2ee;--ac:#1d4ed8;--acx:#fff;--warn:#b45309;--bad:#b91c1c;--ok:#15803d;--soft:#eaf0fd;--vi:#6d28d9;--te:#0e7490}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a111f;--sf:#111a2d;--ink:#e6ebf5;--mut:#93a1bd;--line:#223049;--ac:#6b9bff;--acx:#06112a;--warn:#f5b061;--bad:#ff8b8b;--ok:#6fd48f;--soft:#15213a;--vi:#b9a2ff;--te:#5fd0e6}}
:root[data-theme="dark"]{--bg:#0a111f;--sf:#111a2d;--ink:#e6ebf5;--mut:#93a1bd;--line:#223049;--ac:#6b9bff;--acx:#06112a;--warn:#f5b061;--bad:#ff8b8b;--ok:#6fd48f;--soft:#15213a;--vi:#b9a2ff;--te:#5fd0e6}
.hero{background:linear-gradient(120deg,#0a1a40,#1d3a8a);color:#fff;padding:26px 16px 66px}.hero h1,.hero .sub{color:#fff}.hero .sub{opacity:.82;max-width:760px}.hero h1{font-size:26px}
.wrap{margin-top:-48px}
.kpi{border-top:3px solid var(--ac);box-shadow:0 1px 3px rgba(15,27,51,.08)}.kpi.bad{border-top-color:var(--bad)}.kpi.warn{border-top-color:var(--warn)}.kpi.ok{border-top-color:var(--ok)}
.card{box-shadow:0 1px 3px rgba(15,27,51,.07);border-radius:8px}
.tabs{background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:0 6px;box-shadow:0 1px 3px rgba(15,27,51,.06)}.tab[aria-selected=true]{color:var(--ac)}
.pill{font-weight:600;background:color-mix(in srgb,currentColor 10%,transparent)}
.pill.New{color:var(--ac);border-color:var(--ac)}.pill.Categorized{color:var(--te);border-color:var(--te)}.pill.Assigned{color:var(--vi);border-color:var(--vi)}.pill.InProgress{color:var(--warn);border-color:var(--warn)}.pill.Closed{color:var(--mut);border-color:var(--mut)}
.col{border-top:3px solid var(--ac)}.col:nth-child(2){border-top-color:var(--te)}.col:nth-child(3){border-top-color:var(--vi)}.col:nth-child(4){border-top-color:var(--warn)}.col:nth-child(5){border-top-color:var(--bad)}.col:nth-child(6){border-top-color:var(--ok)}.col:nth-child(7){border-top-color:var(--mut)}
.bc{position:relative;padding-right:36px}.bc .av{position:absolute;top:8px;right:8px}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ac);color:var(--acx);font-size:10px;font-weight:700}
.note{border-left:3px solid var(--ac);background:var(--soft);border-radius:0 4px 4px 0;padding:6px 8px}
.steps i{height:6px}
.dn{display:flex;gap:18px;align-items:center}.donut{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}.donut::before{content:"";position:absolute;inset:16px;background:var(--sf);border-radius:50%}.donut span{position:relative;font:600 22px Georgia,serif}
</style>
</head>
<body>
<div class="hero"><div class="in"><h1>Customer Service Case Management Simulator</h1>
<p class="sub">A CRM-style service desk: log incidents and service requests, categorize, assign, escalate, close and capture the fix as knowledge. Modelled on a Power Platform / Dataverse design; data stays in this browser.</p></div></div>
<div class="wrap">
<div class="kpis" id="kpis"></div>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="view"></div>
</div>
<script>
var STAGES=["New","Categorized","Assigned","In Progress","Escalated","Resolved","Closed"];
var SLA={Critical:4,High:8,Medium:24,Low:72};
var CATS=["Account access","Application failure","Connectivity","Performance","Peripheral / hardware","Software install","Service request"];
var AGENTS=["Asha (L1)","Rohan (L1)","Meera (L2)","Dev (L2)"];
var H=3600000,now=Date.now();
var S={tab:"dash",q:"",sel:null,fs:"All",fp:"All",cases:[],assets:[],sw:[],kb:[],nid:1,msg:""};
function seed(){
S.assets=[{id:"AST-101",name:"Dell Latitude 5440",type:"Laptop",owner:"Priya N.",status:"In use"},{id:"AST-102",name:"HP LaserJet M404",type:"Printer",owner:"Front desk",status:"In use"},{id:"AST-103",name:"Lenovo ThinkPad E14",type:"Laptop",owner:"Unassigned",status:"In stock"}];
S.sw=[{id:"SW-201",name:"Microsoft 365",version:"2024",seats:"50",renewal:"2027-03-31"},{id:"SW-202",name:"VPN Client",version:"5.2",seats:"40",renewal:"2027-01-15"},{id:"SW-203",name:"Zoom",version:"6.1",seats:"25",renewal:"2026-12-05"}];
S.cases=[
{id:"CS-1001",title:"Cannot log in after password reset",customer:"Priya N.",type:"Incident",cat:"Account access",pri:"High",asset:"AST-101",sw:"SW-201",status:"In Progress",owner:"Asha (L1)",created:now-5*H,notes:[{t:"Verified username; password reset email not arriving.",ts:now-4*H}],res:""},
{id:"CS-1002",title:"VPN drops every 10 minutes",customer:"Karan S.",type:"Incident",cat:"Connectivity",pri:"Critical",asset:"AST-103",sw:"SW-202",status:"Escalated",owner:"Meera (L2)",created:now-9*H,notes:[{t:"Reinstalled client, tried a second network. Still drops.",ts:now-8*H},{t:"Escalated to L2: issue is reproducible across networks.",ts:now-7*H}],res:""},
{id:"CS-1003",title:"Install Zoom on new laptop",customer:"Neha R.",type:"Service Request",cat:"Software install",pri:"Low",asset:"AST-103",sw:"SW-203",status:"New",owner:"",created:now-1*H,notes:[],res:""},
{id:"CS-1004",title:"Printer shows offline",customer:"Front desk",type:"Incident",cat:"Peripheral / hardware",pri:"Medium",asset:"AST-102",sw:"",status:"Resolved",owner:"Rohan (L1)",created:now-30*H,notes:[{t:"Printer on a different IP after router restart.",ts:now-29*H}],res:"Reset the printer to a reserved IP and re-added the port on the PC. Test page printed."}];
S.kb=[{title:"Password reset email not arriving",cat:"Account access",fix:"Check the spam folder, confirm the recovery address, then reset from the admin console and force a sign-in on next login.",from:"CS-0950"},{title:"VPN disconnects repeatedly",cat:"Connectivity",fix:"Update the client, switch the tunnel to TCP mode and turn off power saving on the network adapter.",from:"CS-0921"},{title:"Printer shows offline",cat:"Peripheral / hardware",fix:"Reserve a fixed IP for the printer and re-add the TCP/IP port on the PC.",from:"CS-0908"},{title:"Laptop slow after update",cat:"Performance",fix:"Check startup items and free disk space, then run the vendor update tool.",from:"CS-0890"}];S.nid=1005}
try{var d=JSON.parse(localStorage.getItem("csms")||"null");if(d&&d.cases){S=Object.assign(S,d)}else seed()}catch(e){seed()}
var live=false;
function save(){var st={cases:S.cases,assets:S.assets,sw:S.sw,kb:S.kb,nid:S.nid};try{localStorage.setItem("csms",JSON.stringify(st))}catch(e){}if(live){try{fetch("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(st)}).catch(function(){})}catch(e){}}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(i){return document.getElementById(i)}
function opts(a,v){return a.map(function(x){return'<option'+(x===v?" selected":"")+'>'+esc(x)+'</option>'}).join("")}
function isOpen(c){return c.status!=="Resolved"&&c.status!=="Closed"}
function breach(c){return isOpen(c)&&now>c.created+SLA[c.pri]*H}
function ago(ts){var h=Math.round((Date.now()-ts)/H);return h<1?"just now":h<48?h+"h ago":Math.round(h/24)+"d ago"}
function find(l,id){return l.filter(function(x){return x.id===id})[0]}
function kpis(){var o=S.cases.filter(isOpen).length,e=S.cases.filter(function(c){return c.status==="Escalated"}).length,u=S.cases.filter(function(c){return isOpen(c)&&!c.owner}).length,b=S.cases.filter(breach).length,r=S.cases.filter(function(c){return c.status==="Closed"}).length;
$("kpis").innerHTML=[["Open cases",o,""],["Unassigned",u,u?"warn":""],["Escalated",e,e?"bad":""],["SLA breached",b,b?"bad":""],["Closed",r,"ok"],["KB articles",S.kb.length,""]].map(function(k){return'<div class="kpi '+k[2]+'"><b>'+k[1]+'</b><span>'+k[0]+'</span></div>'}).join("")}
function tabs(){var t=[["dash","Dashboard"],["board","Board"],["cases","Cases"],["assets","Assets"],["sw","Software"],["kb","Knowledge base"]];
$("tabs").innerHTML=t.map(function(x){return'<button class="tab" role="tab" data-act="tab" data-v="'+x[0]+'" aria-selected="'+(S.tab===x[0])+'">'+x[1]+'</button>'}).join("")}
function caseList(){var l=S.cases.filter(function(c){return(S.fs==="All"||c.status===S.fs)&&(S.fp==="All"||c.pri===S.fp)&&(!S.q||(c.id+c.title+c.customer).toLowerCase().indexOf(S.q.toLowerCase())>-1)}).sort(function(a,b){return b.created-a.created});
return'<div class="filters"><input id="q" placeholder="Search cases" value="'+esc(S.q)+'" aria-label="Search cases"><select id="fs" aria-label="Filter by status">'+opts(["All"].concat(STAGES),S.fs)+'</select><select id="fp" aria-label="Filter by priority">'+opts(["All","Critical","High","Medium","Low"],S.fp)+'</select></div>'+
(l.length?l.map(function(c){return'<div class="row p-'+c.pri+(S.sel===c.id?" sel":"")+'" tabindex="0" data-act="sel" data-v="'+c.id+'"><span class="id">'+c.id+'</span><span>'+esc(c.title)+'<small>'+esc(c.customer)+' · '+esc(c.owner||"Unassigned")+' · '+ago(c.created)+'</small></span><span><span class="pill '+c.status.replace(" ","")+'">'+c.status+'</span> <span class="pill '+c.pri+'">'+c.pri+'</span>'+(breach(c)?' <span class="pill breach">SLA</span>':'')+'</span></div>'}).join(""):'<p class="empty">No cases match these filters.</p>')+'<button class="btn alt" data-act="csv">Export CSV</button>'}
function intake(){return'<h2>Log a new case</h2><label for="n_t">What is the issue?</label><input id="n_t" placeholder="Short summary"><div class="two"><div><label for="n_c">Customer</label><input id="n_c"></div><div><label for="n_ty">Case type</label><select id="n_ty"><option>Incident</option><option>Service Request</option></select></div><div><label for="n_a">Related asset</label><select id="n_a"><option value="">None</option>'+S.assets.map(function(a){return'<option value="'+a.id+'">'+esc(a.id+" "+a.name)+'</option>'}).join("")+'</select></div><div><label for="n_s">Related software</label><select id="n_s"><option value="">None</option>'+S.sw.map(function(a){return'<option value="'+a.id+'">'+esc(a.name)+'</option>'}).join("")+'</select></div></div><button class="btn" data-act="add">Log case</button>'+(S.msg?'<p class="sub">'+esc(S.msg)+'</p>':'')}
function detail(){var c=find(S.cases,S.sel);if(!c)return'<div class="card">'+intake()+'</div>';
var i=STAGES.indexOf(c.status),a=find(S.assets,c.asset),w=find(S.sw,c.sw),h='<div class="card"><div class="row2"><b>'+c.id+'</b><span class="pill '+c.status.replace(" ","")+'">'+c.status+'</span><span class="pill '+c.pri+'">'+c.pri+'</span><span class="pill">'+c.type+'</span></div><h2 style="margin-top:8px">'+esc(c.title)+'</h2><div class="steps" aria-hidden="true">'+STAGES.map(function(s,k){return'<i class="'+(k<=i?"on":"")+'"></i>'}).join("")+'</div>';
h+='<p class="sub">Customer: '+esc(c.customer)+' · Category: '+esc(c.cat||"Not set")+' · Owner: '+esc(c.owner||"Unassigned")+'<br>Asset: '+esc(a?a.name:"None")+' · Software: '+esc(w?w.name:"None")+(isOpen(c)?' · '+left(c):"")+'</p>';
var s=c.status;
if(s==="New")h+='<label for="d_c">Category</label><select id="d_c">'+opts(CATS,c.cat)+'</select><label for="d_p">Priority</label><select id="d_p">'+opts(["Critical","High","Medium","Low"],c.pri)+'</select><button class="btn" data-act="cat">Categorize case</button>';
if(s==="Categorized")h+='<label for="d_o">Assign to</label><select id="d_o">'+opts(AGENTS,"")+'</select><button class="btn" data-act="assign">Assign case</button>';
if(s==="Assigned")h+='<button class="btn" data-act="start">Start work</button>';
if(s==="In Progress"||s==="Escalated"){h+='<label for="d_n">Troubleshooting note</label><textarea id="d_n" placeholder="What did you check, and what happened?"></textarea><div class="row2"><button class="btn alt" data-act="note">Add note</button>';
if(s==="In Progress")h+='<button class="btn alt" data-act="esc">Escalate to L2</button>';h+='</div><label for="d_r">Resolution</label><textarea id="d_r" placeholder="What fixed it?"></textarea><button class="btn" data-act="resolve">Resolve case</button>'}
if(s==="Resolved")h+='<p><b>Resolution:</b> '+esc(c.res)+'</p><label><input type="checkbox" id="d_k" checked style="width:auto"> Save this fix to the knowledge base</label><button class="btn" data-act="close">Close case</button>';
if(s==="Closed")h+='<p><b>Resolution:</b> '+esc(c.res)+'</p>'+(c.kb?'<p class="sub">Fix saved to the knowledge base.</p>':'<button class="btn alt" data-act="tokb">Save fix to knowledge base</button>');
var sg=S.kb.filter(function(k){return isOpen(c)&&c.cat&&k.cat===c.cat});if(sg.length)h+='<div class="sug"><b>Suggested fixes from the knowledge base</b>'+sg.map(function(k){return'<p>'+esc(k.title)+': '+esc(k.fix)+'</p>'}).join("")+'</div>';if(s==="Resolved"||s==="Closed")h+='<button class="btn alt" data-act="reopen">Reopen case</button>';h+='<h3>Activity</h3>'+(c.notes.length?c.notes.map(function(n){return'<div class="note">'+esc(n.t)+'<small>'+ago(n.ts)+'</small></div>'}).join(""):'<p class="sub">No notes yet.</p>');
return h+'<button class="btn alt" data-act="new">Log another case</button></div>'}
function table(cols,rows,form){return'<div class="card"><div class="scroll"><table><tr>'+cols.map(function(c){return'<th>'+c+'</th>'}).join("")+'</tr>'+rows.map(function(r){return'<tr>'+r.map(function(v){return'<td>'+esc(v)+'</td>'}).join("")+'</tr>'}).join("")+'</table></div>'+form+'</div>'}
function av(n){var p=(n||"?").replace(/\(.*\)/,"").trim().split(" ");return'<span class="av">'+esc((p[0][0]||"?")+(p[1]?p[1][0]:""))+'</span>'}
function donut(p,a,b){return'<div class="card"><h2>SLA health</h2><div class="dn"><div class="donut" style="background:conic-gradient(var(--ok) 0 '+p+'%,var(--bad) '+p+'% 100%)"><span>'+p+'%</span></div><div><p class="sub">Within SLA: <b>'+a+'</b></p><p class="sub">Breached: <b>'+b+'</b></p><p class="sub">Targets: Critical 4h, High 8h, Medium 24h, Low 72h</p></div></div></div>'}
function feed(){var l=[];S.cases.forEach(function(c){c.notes.forEach(function(n){l.push({c:c,n:n})})});l.sort(function(x,y){return y.n.ts-x.n.ts});return'<div class="card"><h2>Recent activity</h2>'+(l.length?l.slice(0,6).map(function(x){return'<div class="note"><b>'+x.c.id+'</b> '+esc(x.c.title)+'<br>'+esc(x.n.t)+'<small>'+ago(x.n.ts)+'</small></div>'}).join(""):'<p class="empty">No activity yet.</p>')+'</div>'}
function left(c){var m=Math.round((c.created+SLA[c.pri]*H-Date.now())/60000);return m<0?"Overdue by "+Math.round(-m/60)+"h":"Due in "+Math.floor(m/60)+"h "+m%60+"m"}
function bar(l,n,m,c){return'<div class="bar '+(c||"")+'"><span>'+esc(l||"Unassigned")+'</span><span class="t"><i style="width:'+(m?Math.round(n/m*100):0)+'%"></i></span><b>'+n+'</b></div>'}
function grp(list,keys,f,cls){var cn=keys.map(function(k){return list.filter(function(c){return f(c)===k}).length}),m=Math.max.apply(null,cn.concat([1]));return'<div class="bars">'+keys.map(function(k,i){return bar(k,cn[i],m,cls&&cls(k))}).join("")+'</div>'}
function dash(){var o=S.cases.filter(isOpen),ok=o.filter(function(c){return !breach(c)}).length,pct=o.length?Math.round(ok/o.length*100):100,age=o.length?Math.round(o.reduce(function(s,c){return s+(Date.now()-c.created)},0)/o.length/H):0;
return'<div class="kpis"><div class="kpi '+(pct<80?"bad":"ok")+'"><b>'+pct+'%</b><span>Open cases within SLA</span></div><div class="kpi"><b>'+age+'h</b><span>Average age of open cases</span></div><div class="kpi"><b>'+S.cases.length+'</b><span>Total cases logged</span></div></div><div class="dgrid"><div class="card"><h2>Cases by status</h2>'+grp(S.cases,STAGES,function(c){return c.status},function(k){return k==="Escalated"?"bad":k==="Closed"||k==="Resolved"?"ok":""})+'</div><div class="card"><h2>Open cases by priority</h2>'+grp(o,["Critical","High","Medium","Low"],function(c){return c.pri},function(k){return k==="Critical"?"bad":k==="High"?"warn":""})+'</div><div class="card"><h2>Cases by category</h2>'+grp(S.cases.filter(function(c){return c.cat}),CATS,function(c){return c.cat})+'</div><div class="card"><h2>Open workload by owner</h2>'+grp(o,AGENTS.concat([""]),function(c){return c.owner})+'</div>'+donut(pct,ok,o.length-ok)+feed()+'</div>'}
function board(){return'<div class="board">'+STAGES.map(function(s){var l=S.cases.filter(function(c){return c.status===s});return'<div class="col"><h3>'+s+' ('+l.length+')</h3>'+l.map(function(c){return'<div class="bc '+c.pri+'" tabindex="0" data-act="open" data-v="'+c.id+'">'+esc(c.title)+'<small>'+c.id+' · '+esc(c.owner||"Unassigned")+(breach(c)?' · SLA breached':'')+'</small>'+av(c.owner)+'</div>'}).join("")+'</div>'}).join("")+'</div>'}
function openCount(f,id){return S.cases.filter(function(c){return c[f]===id&&isOpen(c)}).length}
function view(){kpis();tabs();var v=$("view"),h="";
if(S.tab==="dash")h=dash();if(S.tab==="board")h=board();if(S.tab==="cases")h='<div class="grid"><div class="card">'+caseList()+'</div>'+detail()+'</div>';
if(S.tab==="assets")h=table(["ID","Asset","Type","Owner","Status","Open cases"],S.assets.map(function(a){return[a.id,a.name,a.type,a.owner,a.status,openCount("asset",a.id)]}),'<h3>Add asset</h3><div class="two"><div><label for="a_n">Name</label><input id="a_n"></div><div><label for="a_t">Type</label><input id="a_t" placeholder="Laptop, printer…"></div><div><label for="a_o">Owner</label><input id="a_o"></div></div><button class="btn" data-act="addasset">Add asset</button>');
if(S.tab==="sw")h=table(["ID","Software","Version","Seats","Renewal","Open cases"],S.sw.map(function(a){return[a.id,a.name,a.version,a.seats,a.renewal,openCount("sw",a.id)]}),'<h3>Add software record</h3><div class="two"><div><label for="w_n">Name</label><input id="w_n"></div><div><label for="w_v">Version</label><input id="w_v"></div><div><label for="w_s">Seats</label><input id="w_s" inputmode="numeric"></div><div><label for="w_r">Renewal date</label><input id="w_r" type="date"></div></div><button class="btn" data-act="addsw">Add software</button>');
if(S.tab==="kb")h='<div class="card">'+(S.kb.length?S.kb.map(function(k){return'<div class="kb"><b>'+esc(k.title)+'</b><small class="sub">'+esc(k.cat)+' · from '+k.from+'</small><p>'+esc(k.fix)+'</p></div>'}).join(""):'<p class="empty">No articles yet. Resolve and close a case, and its fix is saved here for repeat issues.</p>')+'</div>';
v.innerHTML=h;save()}
function note(c,t){c.notes.push({t:t,ts:Date.now()})}
function val(i){var e=$(i);return e?e.value.trim():""}
function kbAdd(c){if(c.kb)return;S.kb.unshift({title:c.title,cat:c.cat,fix:c.res,from:c.id});c.kb=true}
document.addEventListener("click",function(e){var t=e.target.closest("[data-act]");if(!t)return;var a=t.dataset.act,c=find(S.cases,S.sel);S.msg="";
if(a==="tab")S.tab=t.dataset.v;
else if(a==="sel")S.sel=t.dataset.v;
else if(a==="new")S.sel=null;
else if(a==="open"){S.sel=t.dataset.v;S.tab="cases"}
else if(a==="reopen"){c.status="In Progress";note(c,"Case reopened.")}
else if(a==="csv"){var rows=[["ID","Title","Customer","Type","Category","Priority","Status","Owner"]].concat(S.cases.map(function(c){return[c.id,c.title,c.customer,c.type,c.cat,c.pri,c.status,c.owner]}));var txt=rows.map(function(r){return r.map(function(v){return'"'+String(v||"").replace(/"/g,'""')+'"'}).join(",")}).join("\n");try{var u=URL.createObjectURL(new Blob([txt],{type:"text/csv"})),lk=document.createElement("a");lk.href=u;lk.download="cases.csv";lk.click()}catch(x){}}
else if(a==="add"){var ti=val("n_t");if(!ti){S.msg="Add a short summary before logging the case.";return view()}
var id="CS-"+S.nid++;S.cases.push({id:id,title:ti,customer:val("n_c")||"Unknown",type:val("n_ty"),cat:"",pri:"Medium",asset:val("n_a"),sw:val("n_s"),status:"New",owner:"",created:Date.now(),notes:[],res:""});S.sel=id}
else if(a==="cat"){c.cat=val("d_c");c.pri=val("d_p");c.status="Categorized";note(c,"Categorized as "+c.cat+", priority "+c.pri+".")}
else if(a==="assign"){c.owner=val("d_o");c.status="Assigned";note(c,"Assigned to "+c.owner+".")}
else if(a==="start"){c.status="In Progress";note(c,"Work started.")}
else if(a==="note"){var n=val("d_n");if(n)note(c,n)}
else if(a==="esc"){var n2=val("d_n");if(!n2){S.msg="";alert("Add a note on what you already tried before escalating.");return}note(c,n2);c.owner="Meera (L2)";c.status="Escalated";note(c,"Escalated to L2 with the steps above.")}
else if(a==="resolve"){var r=val("d_r");if(!r){alert("Describe the fix before resolving the case.");return}c.res=r;c.status="Resolved";note(c,"Resolved.")}
else if(a==="close"){var k=$("d_k");if(k&&k.checked)kbAdd(c);c.status="Closed";note(c,"Closed.")}
else if(a==="tokb"){kbAdd(c)}
else if(a==="addasset"){var n3=val("a_n");if(n3){S.assets.push({id:"AST-"+(101+S.assets.length),name:n3,type:val("a_t")||"Other",owner:val("a_o")||"Unassigned",status:"In use"})}}
else if(a==="addsw"){var n4=val("w_n");if(n4){S.sw.push({id:"SW-"+(201+S.sw.length),name:n4,version:val("w_v")||"-",seats:val("w_s")||"-",renewal:val("w_r")||"-"})}}
view()});
document.addEventListener("change",function(e){if(e.target.id==="q"){S.q=e.target.value;view()}if(e.target.id==="fs"){S.fs=e.target.value;view()}if(e.target.id==="fp"){S.fp=e.target.value;view()}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.dataset&&/^(sel|open)$/.test(e.target.dataset.act||"")){S.sel=e.target.dataset.v;S.tab="cases";view()}});
view();
try{fetch("/api/state").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){if(d&&d.cases&&d.cases.length){S=Object.assign(S,d)}live=true;view()}).catch(function(){})}catch(e){}
</script>
</body>
</html>
